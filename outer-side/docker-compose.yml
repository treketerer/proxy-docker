
services:
  gost-proxy:
    image: gogost/gost:latest
    container_name: proxy
    restart: unless-stopped
    command: >
      -L=${PROXY_LOGIN}:${PROXY_PASSWORD}@:9000
    ports:
      - "9000:9000"

  gost-tg-receiver:
    image: gogost/gost:latest
    container_name: gost-receiver
    restart: unless-stopped
    command: >
      -L=ss://aes-128-gcm:${GOST_PASSWORD}@:9020?nodelay=true
      -F=tcp://telemt:9030?nodelay=true
    ports:
      - "9020:9020"
    depends_on:
      - telemt

  telemt:
    image: ghcr.io/telemt/telemt:latest
    container_name: telemt
    restart: unless-stopped

    volumes:
      - ./config/telemt:/etc/telemt:ro
      - ./site:/var/lib/telemt/public:ro

    command: ["/etc/telemt/telemt.toml"]

    tmpfs:
      - /run/telemt:rw,mode=1777,size=4m

    environment:
      - RUST_LOG=info

    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 65536
        hard: 262144

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: telemt-web-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - telemt

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped

    ports:
      - "9050:3001"

    volumes:
      - ./config/kuma:/app/data

    environment:
      - TZ=UTC
      - UMASK=0022
