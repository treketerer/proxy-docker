services:
  gost-proxy:
    image: gogost/gost:latest
    container_name: proxy
    restart: unless-stopped
    
    command: -L=${PROXY_LOGIN}:${PROXY_PASSWORD}@:9000
    ports:
      - "9000:9000"

  gost-tg-receiver:
    image: gogost/gost:latest
    container_name: gost-receiver
    restart: unless-stopped
    # Принимаем шифрованный shadowsocks-туннель на порту 9000 и пересылаем локально на telemt:9020
    command: -L=ss://aes-128-gcm:${GOST_PASSWORD}@:9020?nodelay=true -F=tcp://telemt:9030?nodelay=true
    ports:
      - "9010:9010"

  
  nginx:
    image: nginx:alpine
    container_name: telemt-web-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 32M  # NGINX в режиме раздачи статики потребляет около 10-15 МБ
    depends_on:
      - telemt_web
      
      
  telemt_web:
    image: ghcr.io/telemt/telemt:latest
    container_name: telemt
    restart: unless-stopped
    volumes:
      - ./config:/etc/telemt:rw
    tmpfs:
      - /run/telemt:rw,mode=1777,size=2m  # Уменьшили tmpfs с 4m до 2m
    environment:
      - RUST_LOG=error  # Логируем только ошибки, снижает нагрузку на I/O и память
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 64M  # Жесткий лимит: Telemt потребляет совсем мало RAM
  command: ["/etc/telemt/config.toml"]

  telemt:
    image: ghcr.io/telemt/telemt:latest
    container_name: telemt
    restart: unless-stopped

    ports:
      - "9030:9030"
      - "9020:9020"
      
    working_dir: /etc/telemt
    volumes:
      - ./cfg/telemt.toml:/etc/telemt/config.toml:ro
    tmpfs:
      - /etc/telemt:rw,mode=1777,size=4m
    environment:
      - RUST_LOG=info

    healthcheck:
      test: [ "CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    read_only: true

    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 65536
        hard: 262144

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    ports:
      - "9050:3001"
    volumes:
      - ./cfg/kuma:/app/data
    environment:
      - TZ=UTC  # Set the timezone
      - UMASK=0022  # Set your file permissions manually
    networks:
      - kuma_network  # add your own custom network config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kuma_network:
    driver: bridge